<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>트위터게임</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="logo" data-icon="bird"></div>
      <button class="nav-btn active" data-view="home"><span data-icon="house"></span><span class="label">홈</span></button>
      <!-- 검색은 사이드바에도 둔다 — 모바일에선 우측 레일이 숨으므로 이게 유일한 입구다 -->
      <button class="nav-btn" data-view="search"><span data-icon="search"></span><span class="label">검색</span></button>
      <!-- 뱃지는 아이콘 우측 상단에 붙는다. [data-icon] 안에 넣으면 Icons.mount()가 innerHTML로 덮어쓴다 -->
      <button class="nav-btn" data-view="notif"><span class="nav-icon"><span data-icon="bell"></span><span id="notif-badge" class="badge hidden"></span></span><span class="label">알림</span></button>
      <button class="nav-btn" data-view="dm"><span class="nav-icon"><span data-icon="mail"></span><span id="dm-badge" class="badge hidden"></span></span><span class="label">쪽지</span></button>
      <button class="nav-btn" data-view="profile"><span data-icon="user"></span><span class="label">프로필</span></button>
      <!-- 모바일 독바에만 보이는 스탯 팝오버 토글 (데스크톱은 사이드바에 스탯이 상주하므로 숨김) -->
      <button id="stats-toggle" class="nav-btn stats-toggle" aria-expanded="false"><span data-icon="chart-column"></span><span class="label">스탯</span></button>
      <!-- 게시하기. 데스크톱은 사이드바 버튼, 모바일은 우하단 + 플로팅 버튼(CSS가 가른다) -->
      <button id="post-btn" class="post-btn" aria-label="게시하기">
        <span data-icon="plus"></span><span class="label">게시하기</span>
      </button>

      <div class="stats-panel" data-stats></div>

      <!-- 실제 X 사이드바 하단의 계정 블록. 누르면 로그아웃 팝오버가 뜬다.
           팝오버를 블록 기준 bottom:100%로 붙이기 위해 감싸는 컨테이너가 필요하다 -->
      <div class="account-block">
        <button id="account" class="account" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar small"><img class="pfp" alt="" src="assets/avatars/me.svg"></span>
          <span class="account-id label">
            <span class="account-name">나</span>
            <span class="account-handle">@me</span>
          </span>
          <span class="account-more label" data-icon="ellipsis"></span>
        </button>

        <div id="account-menu" class="account-menu hidden" role="menu">
          <button id="logout" class="menu-item" role="menuitem">
            <span data-icon="log-out"></span><span>@me 계정에서 로그아웃</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="main">
      <header class="topbar">
        <span id="day">1일차</span>
        <span id="followers">팔로워 10</span>
      </header>

      <!-- 모바일용 스탯 스트립. 데스크톱에선 사이드바 쪽(.stats-panel)만 보인다 -->
      <div class="stats-strip" data-stats></div>

      <section id="view-home" class="view">
        <!-- 실제 X의 추천/팔로잉 탭. 컴포즈 박스는 없애고 게시 버튼을 사이드바로 옮겼다 -->
        <div class="profile-tabs home-tabs">
          <button class="tab-btn home-tab active" data-htab="all">추천</button>
          <button class="tab-btn home-tab" data-htab="following">팔로우 중</button>
        </div>
        <div id="feed" class="feed"></div>
      </section>

      <!-- 내 프로필과 남의 프로필이 같은 뷰를 쓴다. 내용은 ui.js의 renderProfile()이 채운다 -->
      <section id="view-profile" class="view hidden">
        <!-- 남의 프로필일 때만 뜨는 뒤로가기. 내 프로필은 사이드바로 들어오니 필요 없다 -->
        <div id="profile-head" class="detail-head hidden">
          <button id="profile-back" class="icon-btn" data-icon="arrow-left" aria-label="뒤로"></button>
          <h2 id="profile-head-name"></h2>
        </div>
        <div class="profile-banner"></div>
        <div class="profile-top">
          <div class="avatar big"><img id="profile-pfp" class="pfp" alt="" src="assets/avatars/me.svg"></div>
          <!-- 남의 프로필에만 뜬다. DM은 말을 튼 계정에만 -->
          <div class="profile-acts">
            <button id="profile-dm" class="icon-btn round hidden" data-icon="mail" aria-label="쪽지 보내기"></button>
            <button id="profile-follow" class="follow-btn hidden">팔로우</button>
          </div>
        </div>
        <div class="profile-info">
          <h2 id="profile-name" class="profile-name">나</h2>
          <div id="profile-handle" class="handle">@me</div>
          <p id="profile-bio" class="profile-bio"></p>
          <!-- "N일차 활동 중"은 내 기록이라 남의 프로필에서는 숨긴다 -->
          <div id="profile-meta" class="profile-meta">
            <span><span data-icon="calendar"></span><span id="profile-since">1일차</span> 활동 중</span>
          </div>
          <div class="profile-counts">
            <span><b id="profile-tweet-count">0</b> 게시물</span>
            <!-- 내 프로필에만 뜬다. 남이 누굴 팔로우하는지는 데이터가 없다 -->
            <button id="profile-following-count" class="count-btn hidden"><b id="profile-following">0</b> 팔로우 중</button>
            <span><b id="profile-followers">10</b> 팔로워</span>
          </div>
        </div>
        <div class="profile-tabs">
          <button class="tab-btn active" data-tab="posts">게시물</button>
          <button class="tab-btn" data-tab="replies">답글</button>
        </div>
        <div id="profile-tweets" class="feed"></div>
      </section>

      <section id="view-notif" class="view hidden">
        <div id="notif-list" class="feed"></div>
      </section>

      <!-- 검색: 입력창은 여기 하나만 둔다. 레일의 검색 상자는 이 화면으로 보내는 버튼이다
           (입력창을 두 개 두면 값을 서로 맞춰줘야 한다) -->
      <section id="view-search" class="view hidden">
        <div class="detail-head">
          <button id="search-back" class="icon-btn" data-icon="arrow-left" aria-label="뒤로"></button>
          <label class="search-field">
            <span data-icon="search"></span>
            <input id="search-input" type="search" placeholder="트윗과 계정 검색" autocomplete="off">
          </label>
        </div>
        <div class="profile-tabs">
          <button class="tab-btn search-tab active" data-stab="tweets">트윗</button>
          <button class="tab-btn search-tab" data-stab="accounts">계정</button>
        </div>
        <div id="search-results" class="feed"></div>
      </section>

      <!-- 내가 팔로우한 계정 목록. 프로필의 "팔로우 중" 숫자를 눌러 들어온다 -->
      <section id="view-following" class="view hidden">
        <div class="detail-head">
          <button id="following-back" class="icon-btn" data-icon="arrow-left" aria-label="뒤로"></button>
          <h2>팔로우 중</h2>
        </div>
        <div id="following-list"></div>
      </section>

      <!-- 쪽지: 목록과 대화방을 한 뷰에서 그린다 (프로필과 같은 방식 — dmHandle이 null이면 목록) -->
      <section id="view-dm" class="view hidden">
        <div class="detail-head">
          <button id="dm-back" class="icon-btn hidden" data-icon="arrow-left" aria-label="뒤로"></button>
          <h2 id="dm-title">쪽지</h2>
        </div>
        <div id="dm-list"></div>
        <div id="dm-room" class="dm-room hidden">
          <div id="dm-msgs" class="dm-msgs"></div>
          <!-- 자유 입력이 아니라 고를 말이다. 다 떨어지면 안내가 뜬다 -->
          <div id="dm-choices" class="dm-choices"></div>
        </div>
      </section>

      <!-- 트윗 상세: 원본 트윗 + 거기 달린 답글. 홈 타임라인에는 답글이 안 뜬다 -->
      <section id="view-tweet" class="view hidden">
        <div class="detail-head">
          <button id="detail-back" class="icon-btn" data-icon="arrow-left" aria-label="뒤로"></button>
          <h2>게시물</h2>
        </div>
        <div id="tweet-detail-main"></div>
        <div id="tweet-detail-replies" class="feed"></div>
      </section>
    </main>

    <!-- 실제 X의 우측 영역. 본문 폭을 줄여 트윗 줄이 짧아지고, 계정을 눌러 프로필로 갈 수 있다.
         데이터가 있는 것만 담는다 — 검색은 붙일 백엔드가 없어서 넣지 않았다. -->
    <aside class="rail">
      <!-- 실제 입력은 검색 화면에 있다 — 이건 눌러서 그 화면으로 가는 버튼이다 -->
      <button id="rail-search" class="rail-search">
        <span data-icon="search"></span><span id="rail-search-text">검색</span>
      </button>
      <section class="rail-box">
        <h2>팔로우 중인 계정</h2>
        <div id="rail-accounts"></div>
        <button id="rail-more" class="rail-more hidden">더 보기</button>
      </section>
      <!-- 만났지만 아직 팔로우 안 한 계정. 없으면 통째로 숨는다 -->
      <section id="rail-suggest-box" class="rail-box hidden">
        <h2>알 수도 있는 계정</h2>
        <div id="rail-suggest"></div>
      </section>
      <section class="rail-box">
        <h2>무슨 일이 일어나고 있나요?</h2>
        <div id="rail-trends"></div>
      </section>
    </aside>
  </div>

  <!-- 행동 선택 딤팝업 -->
  <div id="compose-modal" class="overlay hidden">
    <div class="card compose-card">
      <div class="modal-head">
        <h3>오늘 무엇을 할까?</h3>
        <button id="compose-close" class="icon-btn" data-icon="x" aria-label="닫기"></button>
      </div>
      <div id="action-list" class="action-list"></div>
    </div>
  </div>

  <!-- 트윗 여부 선택 딤팝업 (행동 후) -->
  <div id="tweet-modal" class="overlay hidden">
    <div class="card tweet-card">
      <h3 id="tweet-title">이걸 트윗할까?</h3>
      <div id="tweet-preview" class="preview"></div>
      <div class="modal-actions">
        <button id="tweet-skip" class="btn-ghost">안 올린다</button>
        <button id="tweet-post" class="btn-primary">트윗한다</button>
      </div>
    </div>
  </div>

  <!-- 주급날 딤팝업. 날짜 전환은 팝업 없이 조용히 넘어가고, 정산일에만 이걸 띄운다 -->
  <div id="settle-modal" class="overlay hidden">
    <div class="card payday">
      <div class="payday-head">
        <span data-icon="wallet"></span>
        <div>
          <b>주급날</b>
          <span id="payday-range"></span>
        </div>
      </div>
      <div id="payday-amount" class="payday-amount"></div>
      <div id="payday-rows" class="settle-rows"></div>
      <button id="payday-ok" class="btn-primary">확인</button>
    </div>
  </div>

  <div id="ending-overlay" class="overlay hidden"></div>

  <div id="gain-toast" class="gain-toast hidden"></div>

  <script src="data/economy.js"></script>
  <script src="data/actions.js"></script>
  <script src="data/npcs.js"></script>
  <script src="data/dms.js"></script>
  <script src="data/events.js"></script>
  <script src="data/endings.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
